# Política interna de movimentação e remuneração (fictícia).
codigo: POLITICA_MOVIMENTACAO
tipo: POLITICA
nome: Política de movimentação interna e remuneração
versao: 1
vigencia:
  inicio: "2025-01-01"
  fim: null
descricao: >
  Parâmetros da política interna usados pelos contratos de processo: interstício
  mínimo no cargo, avaliação mínima, saltos de nível, limites de aumento e de bônus.
parametros:
  promocao:
    meses_minimos_no_cargo: 12
    meses_minimos_para_executivo: 24
    avaliacao_minima: 3
    max_saltos_nivel: 1
    aumento_max_percentual: 25
  merito:
    percentual_max: 10
    meses_desde_ultimo_aumento: 12
    avaliacao_minima: 4
  bonus:
    avaliacao_minima: 3
    multiplo_salario_max_sem_comite: 3
  transferencia:
    meses_minimos_na_unidade: 6
  conduta:
    janela_advertencias_meses: 12
    max_advertencias: 1
  # Programas com vigência: o colaborador participa por um período a partir da
  # data oficial. Enquanto o programa está ativo, as concessões entram no estado
  # alvo; no vencimento (ou encerramento antecipado) elas são retiradas pela linha.
  programas:
    ALTO_POTENCIAL:
      nome: Programa de Alto Potencial
      duracao_meses: 12
      aviso_dias: 30
      avaliacao_minima: 4
      meses_minimos_de_casa: 12
      renovacoes_max: 1
      evento_aviso: colaborador.programa_a_vencer
      evento_vencimento: colaborador.programa_expirado
      trilha: TRILHA_ALTO_POTENCIAL
      concessoes:
        verbas:
          - {codigo: BOLSA_ALTO_POTENCIAL, nome: Bolsa de desenvolvimento (alto potencial), valor: 1200}
        beneficios:
          - {codigo: MENTORIA_EXECUTIVA, nome: Mentoria executiva, plano: PROGRAMA_ALTO_POTENCIAL}
        acessos: [PLATAFORMA_LIDERANCA]
