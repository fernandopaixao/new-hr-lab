codigo: PROC_MUDANCA_JORNADA
tipo: PROCESSO
nome: Mudança de jornada
evento: colaborador.jornada_alterada
versao: 1
vigencia: {inicio: "2025-01-01", fim: null}
descricao: Alteração da jornada contratual.
evento_schema:
  obrigatorios: [dados.horas]
  colaborador: DEVE_EXISTIR
elegibilidade:
  regras:
    - id: JOR-01
      descricao: Colaborador ativo
      expressao: "colaborador.situacao == 'ATIVO'"
      tipo: BLOQUEANTE
      explicacao_falha: "Colaborador está {colaborador.situacao}."
    - id: JOR-02
      descricao: Bancário sem cargo de confiança não pode ter jornada acima de 6 horas
      expressao: "cargo_atual.cargo_confianca == True or evento.dados.horas <= norma.jornada_bancario_horas"
      tipo: BLOQUEANTE
      base_legal: CLT art. 224 caput
      explicacao_falha: "Jornada de {evento.dados.horas}h para cargo sem confiança viola o art. 224."
    - id: JOR-03
      descricao: Limite constitucional de 8 horas diárias
      expressao: "evento.dados.horas <= 8"
      tipo: BLOQUEANTE
      base_legal: CF art. 7 XIII
      explicacao_falha: "Jornada de {evento.dados.horas}h acima de 8h."
